{% extends 'base.html' %}

{% block title %}{{ 'Editar' if contato else 'Novo' }} Contato · Agenda{% endblock %}

{% block content %}

<div class="card-form">
  <h2>{{ '✏️ Editar Contato' if contato else '➕ Novo Contato' }}</h2>

  <form method="POST">
    <div class="campo">
      <label for="nome">Nome <span class="obrigatorio">*</span></label>
      <input type="text" id="nome" name="nome"
             value="{{ contato.nome if contato else '' }}"
             placeholder="Nome completo" required autofocus>
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email"
             value="{{ contato.email if contato else '' }}"
             placeholder="exemplo@email.com">
    </div>

    <div class="campo">
      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone"
             value="{{ contato.telefone if contato else '' }}"
             placeholder="(84) 99999-9999">
    </div>

    <div class="acoes-form">
      <button type="submit" class="btn btn-salvar">
        {{ '💾 Salvar alterações' if contato else '✅ Adicionar contato' }}
      </button>
      <a href="{{ url_for('index') }}" class="btn btn-cancelar">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
